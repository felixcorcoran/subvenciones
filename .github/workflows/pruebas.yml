name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - run: npm run build
      # Los recorridos en el navegador y la accesibilidad (e2e/), sobre la web recién compilada
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
