name: Plataforma

# Los servicios Java de plataforma/. Solo se lanza si cambia esa carpeta: la web y la recogida
# diaria siguen con sus propios workflows.
on:
  push:
    branches: [main]
    paths: ['plataforma/**', '.github/workflows/plataforma.yml']
  pull_request:
    paths: ['plataforma/**', '.github/workflows/plataforma.yml']

defaults:
  run:
    working-directory: plataforma

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      # Unitarias, contrato con la web, arquitectura y PostgreSQL con Testcontainers
      - run: sh mvnw -B verify
      # Las de Testcontainers se saltan solas sin Docker: en CI eso las escondería
      - name: Ninguna prueba se puede saltar
        run: |
          if grep -l 'skipped="[1-9]' */target/surefire-reports/TEST-*.xml; then
            echo "::error::Hay pruebas saltadas: ¿no hay Docker?"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: informes-pruebas
          path: plataforma/**/target/surefire-reports/

  imagen:
    runs-on: ubuntu-latest
    needs: pruebas
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f servicio-encaje/Dockerfile -t subvenciones/servicio-encaje .
