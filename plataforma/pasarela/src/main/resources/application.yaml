server:
  port: ${PORT:8000}

spring:
  application:
    name: pasarela
  cloud:
    gateway:
      server:
        webmvc:
          # Cada ruta a su servicio. Las cabeceras (también Authorization) pasan tal cual:
          # cada servicio valida su token
          routes:
            # Antes que el encaje: comparten el prefijo /api/v1/convocatorias
            - id: preguntas
              uri: ${PREGUNTAS_URL:http://localhost:8084}
              predicates:
                - Path=/api/v1/convocatorias/*/preguntas,/api/v1/indices
            - id: encaje
              uri: ${ENCAJE_URL:http://localhost:8080}
              predicates:
                - Path=/api/v1/encajes,/api/v1/convocatorias/*
            - id: recogida
              uri: ${RECOGIDA_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/recogidas
            - id: lectura
              uri: ${LECTURA_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/lecturas
            - id: avisos
              uri: ${AVISOS_URL:http://localhost:8083}
              predicates:
                - Path=/api/v1/suscripciones/**,/api/v1/baja/**,/api/v1/avisos/**

subvenciones:
  pasarela:
    # CORS: desde qué webs se puede llamar a la API con el navegador
    origenes: ${ORIGENES:https://subvenciones.felixcorcoran.es,https://alertas.felixcorcoran.es,http://localhost:4321,http://localhost:4200}
    # Límite por IP en lo público. Preguntar gasta cupo de la IA: es lo más limitado
    limites:
      - { ruta: "POST /api/v1/convocatorias/*/preguntas", veces: "${LIMITE_PREGUNTAS:20}", cada: 1h }
      - { ruta: "POST /api/v1/suscripciones", veces: "${LIMITE_SUSCRIPCIONES:5}", cada: 10m }
      - { ruta: "POST /api/v1/encajes", veces: "${LIMITE_ENCAJES:60}", cada: 1m }

management:
  endpoints:
    web:
      exposure:
        include: health,info
