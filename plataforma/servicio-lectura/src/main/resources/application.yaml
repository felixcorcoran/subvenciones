server:
  port: ${PORT:8082}

spring:
  application:
    name: servicio-lectura
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak: quién emite los tokens y dónde están sus claves públicas
          issuer-uri: ${KEYCLOAK_EMISOR:http://localhost:8180/realms/subvenciones}
          jwk-set-uri: ${KEYCLOAK_CLAVES:http://localhost:8180/realms/subvenciones/protocol/openid-connect/certs}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lectura}
    username: ${DATABASE_USER:subvenciones}
    password: ${DATABASE_PASSWORD:subvenciones}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: servicio-lectura
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      properties:
        enable.idempotence: true

subvenciones:
  bdns:
    url: ${BDNS_URL:https://www.infosubvenciones.es/bdnstrans/api}
  gemini:
    url: ${GEMINI_URL:https://generativelanguage.googleapis.com/v1beta/models}
    # Clave de Google AI Studio de un proyecto SIN facturación. Sin clave, no se lee nada
    clave: ${GEMINI_API_KEY:}
    modelos: ${GEMINI_MODELS:gemini-3.8-flash,gemini-3.6-flash,gemini-3.7-flash,gemini-3.5-flash,gemini-3.5-flash-lite}
  lectura:
    cron: ${LECTURA_CRON:0 0 7-22 * * *}
    max-por-pasada: ${MAX_ANALIZAR:10}

# Rutas sin token y rutas solo para el rol admin de Keycloak (módulo seguridad); lo demás pide usuario
subvenciones.seguridad:
  publicas: []
  admin: ["POST /api/v1/lecturas"]

management:
  endpoints:
    web:
      exposure:
        include: health,info
