server:
  port: ${PORT:8081}

spring:
  application:
    name: servicio-recogida
  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak: quién emite los tokens y dónde están sus claves públicas
          issuer-uri: ${KEYCLOAK_EMISOR:http://localhost:8180/realms/subvenciones}
          jwk-set-uri: ${KEYCLOAK_CLAVES:http://localhost:8180/realms/subvenciones/protocol/openid-connect/certs}
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/recogida}
    username: ${DATABASE_USER:subvenciones}
    password: ${DATABASE_PASSWORD:subvenciones}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Un evento confirmado está en todas las réplicas, y un reintento no lo duplica
      acks: all
      properties:
        enable.idempotence: true

subvenciones:
  bdns:
    url: ${BDNS_URL:https://www.infosubvenciones.es/bdnstrans/api}
  recogida:
    # Cada mañana a las 6:30 (hora de Madrid); «-» la desactiva
    cron: ${RECOGIDA_CRON:0 30 6 * * *}

# Rutas sin token y rutas solo para el rol admin de Keycloak (módulo seguridad); lo demás pide usuario
subvenciones.seguridad:
  publicas: []
  admin: ["POST /api/v1/recogidas"]

management:
  endpoints:
    web:
      exposure:
        include: health,info
