server:
  port: ${PORT:8084}

spring:
  application:
    name: servicio-preguntas
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/preguntas}
    username: ${DATABASE_USER:subvenciones}
    password: ${DATABASE_PASSWORD:subvenciones}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: servicio-preguntas
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all

subvenciones:
  bdns:
    url: ${BDNS_URL:https://www.infosubvenciones.es/bdnstrans/api}
  gemini:
    url: ${GEMINI_URL:https://generativelanguage.googleapis.com/v1beta/models}
    # Clave de Google AI Studio de un proyecto SIN facturación
    clave: ${GEMINI_API_KEY:}
    modelos: ${GEMINI_MODELS:gemini-3.8-flash,gemini-3.6-flash,gemini-3.7-flash,gemini-3.5-flash,gemini-3.5-flash-lite}
    modelo-vectores: ${GEMINI_MODELO_VECTORES:gemini-embedding-2}
  preguntas:
    cron: ${INDEXADO_CRON:0 30 * * * *}
    indexar-por-pasada: ${INDEXAR_POR_PASADA:10}

management:
  endpoints:
    web:
      exposure:
        include: health,info
