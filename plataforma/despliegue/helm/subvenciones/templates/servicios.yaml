{{- /* Un Deployment y un Service por cada servicio de values.yaml, todos con la misma forma */ -}}
{{- range $nombre, $s := .Values.servicios }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $nombre }}
  labels:
    app.kubernetes.io/name: {{ $nombre }}
    app.kubernetes.io/part-of: subvenciones
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $nombre }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $nombre }}
        app.kubernetes.io/part-of: subvenciones
    spec:
      # Sin las variables que Kubernetes inyecta por cada Service (PASARELA_PORT=tcp://…)
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      {{- if $s.baseDeDatos }}
      {{- $bd := splitList ":" $.Values.comun.baseDeDatos.servidor }}
      # Antes de arrancar Spring Boot: espera a que PostgreSQL acepte conexiones por TCP (así el
      # servicio no se reinicia mientras la base de datos termina de arrancar) y crea la base del
      # servicio si no existe. En local ya la crea el script del primer arranque de PostgreSQL
      # (mientras lo ejecuta solo escucha en su socket local, así que por TCP aún no responde);
      # en AWS (RDS) la crea este paso.
      initContainers:
        - name: prepara-base-de-datos
          image: {{ $.Values.esperaBaseDeDatos.imagen | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - { name: PGHOST, value: {{ index $bd 0 | quote }} }
            - { name: PGPORT, value: {{ index $bd 1 | default "5432" | quote }} }
            - { name: PGUSER, value: {{ $.Values.comun.baseDeDatos.usuario | quote }} }
            - { name: PGDATABASE, value: postgres }
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef: { name: subvenciones, key: base-de-datos }
          command:
            - sh
            - -c
            - |
              until pg_isready -q; do
                echo "Esperando a PostgreSQL en $PGHOST:$PGPORT…"; sleep 2
              done
              if [ "$(psql -tAc "SELECT 1 FROM pg_database WHERE datname = '{{ $s.baseDeDatos }}'")" != "1" ]; then
                echo "Creando la base de datos {{ $s.baseDeDatos }}"
                psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE "{{ $s.baseDeDatos }}"'
              fi
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 64Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
      {{- end }}
      containers:
        - name: {{ $nombre }}
          image: "{{ $.Values.imagen.registro }}/{{ $nombre }}:{{ $.Values.imagen.etiqueta }}"
          imagePullPolicy: {{ $.Values.imagen.politica }}
          ports:
            - name: http
              containerPort: {{ $s.puerto }}
          env:
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ $.Values.comun.otlp | quote }}
            {{- if ne (toString $s.seguridad) "false" }}
            - name: KEYCLOAK_EMISOR
              value: {{ $.Values.comun.keycloak.emisor | quote }}
            - name: KEYCLOAK_CLAVES
              value: {{ $.Values.comun.keycloak.claves | quote }}
            {{- end }}
            {{- if $s.kafka }}
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: {{ $.Values.comun.kafka | quote }}
            {{- end }}
            {{- if $s.baseDeDatos }}
            - name: DATABASE_URL
              value: "jdbc:postgresql://{{ $.Values.comun.baseDeDatos.servidor }}/{{ $s.baseDeDatos }}"
            - name: DATABASE_USER
              value: {{ $.Values.comun.baseDeDatos.usuario | quote }}
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef: { name: subvenciones, key: base-de-datos }
            {{- end }}
            {{- if $s.gemini }}
            - name: GEMINI_API_KEY
              valueFrom:
                secretKeyRef: { name: subvenciones, key: gemini }
            {{- end }}
            {{- range $clave, $valor := $s.env }}
            - name: {{ $clave }}
              value: {{ $valor | quote }}
            {{- end }}
          # Spring Boot detecta Kubernetes y publica estas dos comprobaciones
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
          resources:
            {{- toYaml $.Values.recursos | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $nombre }}
  labels:
    app.kubernetes.io/part-of: subvenciones
spec:
  selector:
    app.kubernetes.io/name: {{ $nombre }}
  ports:
    - name: http
      port: {{ $s.puerto }}
      targetPort: http
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: subvenciones
type: Opaque
stringData:
  base-de-datos: {{ .Values.secretos.baseDeDatos | quote }}
  gemini: {{ .Values.secretos.gemini | quote }}
