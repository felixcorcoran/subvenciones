# Entorno local: docker compose up --build (desde plataforma/)
services:
  postgres:
    # PostgreSQL 17 con pgvector (la búsqueda por significado de servicio-preguntas)
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: subvenciones
      POSTGRES_USER: subvenciones
      POSTGRES_PASSWORD: subvenciones
    ports:
      - "5432:5432"
    volumes:
      - ./infra/postgres/crear-bases.sql:/docker-entrypoint-initdb.d/crear-bases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subvenciones -d subvenciones"]
      interval: 5s
      retries: 10

  # Kafka en modo KRaft, sin ZooKeeper: un solo nodo que hace de broker y de controlador
  kafka:
    image: apache/kafka:4.1.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNO://:29092,EXTERNO://:9092,CONTROLADOR://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka:29092,EXTERNO://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT,CONTROLADOR:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLADOR
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:29092 > /dev/null"]
      interval: 5s
      retries: 20

  servicio-recogida:
    build:
      context: .
      dockerfile: servicio-recogida/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/recogida
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_EMISOR: http://localhost:8180/realms/subvenciones
      KEYCLOAK_CLAVES: http://keycloak:8080/realms/subvenciones/protocol/openid-connect/certs
      # En local no se programa: se lanza a mano con POST localhost:8081/api/v1/recogidas
      RECOGIDA_CRON: "-"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  servicio-lectura:
    build:
      context: .
      dockerfile: servicio-lectura/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/lectura
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_EMISOR: http://localhost:8180/realms/subvenciones
      KEYCLOAK_CLAVES: http://keycloak:8080/realms/subvenciones/protocol/openid-connect/certs
      # La clave de Google AI Studio (proyecto sin facturación) se toma del entorno; sin ella no se lee nada
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # Pocas por pasada en local, para no gastar el cupo gratuito
      MAX_ANALIZAR: ${MAX_ANALIZAR:-3}
      # En local no se programa: se lanza a mano con POST localhost:8082/api/v1/lecturas
      LECTURA_CRON: "-"
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  servicio-encaje:
    build:
      context: .
      dockerfile: servicio-encaje/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/subvenciones
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_EMISOR: http://localhost:8180/realms/subvenciones
      KEYCLOAK_CLAVES: http://keycloak:8080/realms/subvenciones/protocol/openid-connect/certs
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  servicio-avisos:
    build:
      context: .
      dockerfile: servicio-avisos/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/avisos
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_EMISOR: http://localhost:8180/realms/subvenciones
      KEYCLOAK_CLAVES: http://keycloak:8080/realms/subvenciones/protocol/openid-connect/certs
      ENCAJE_URL: http://servicio-encaje:8080
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      # En local no se programa: se lanza a mano con POST localhost:8083/api/v1/avisos/pasada
      AVISOS_CRON: "-"
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mailpit:
        condition: service_started

  servicio-preguntas:
    build:
      context: .
      dockerfile: servicio-preguntas/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/preguntas
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KEYCLOAK_EMISOR: http://localhost:8180/realms/subvenciones
      KEYCLOAK_CLAVES: http://keycloak:8080/realms/subvenciones/protocol/openid-connect/certs
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # En local no se programa: una convocatoria se indexa al preguntarle, o con POST localhost:8084/api/v1/indices
      INDEXADO_CRON: "-"
    ports:
      - "8084:8084"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Keycloak: el proveedor de identidad (OAuth2 / OIDC). Realm, rol admin y clientes en infra/keycloak
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    command: ["start-dev", "--import-realm"]
    environment:
      # La misma dirección en el emisor de los tokens, se pidan desde fuera o desde otro contenedor
      KC_HOSTNAME: http://localhost:8180
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./infra/keycloak/realm-subvenciones.json:/opt/keycloak/data/import/realm-subvenciones.json:ro
    ports:
      - "8180:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1
Host: localhost
Connection: close

' >&3 && grep -q UP <&3"]
      interval: 5s
      retries: 40

  # La única entrada desde fuera: rutas, CORS y límite por IP
  pasarela:
    build:
      context: .
      dockerfile: pasarela/Dockerfile
    environment:
      ENCAJE_URL: http://servicio-encaje:8080
      RECOGIDA_URL: http://servicio-recogida:8081
      LECTURA_URL: http://servicio-lectura:8082
      AVISOS_URL: http://servicio-avisos:8083
      PREGUNTAS_URL: http://servicio-preguntas:8084
    ports:
      - "8000:8000"

  # Recoge los correos en local sin mandarlos a nadie: http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"
      - "1025:1025"
