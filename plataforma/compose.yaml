# Entorno local: docker compose up --build (desde plataforma/)
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: subvenciones
      POSTGRES_USER: subvenciones
      POSTGRES_PASSWORD: subvenciones
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U subvenciones -d subvenciones"]
      interval: 5s
      retries: 10

  servicio-encaje:
    build:
      context: .
      dockerfile: servicio-encaje/Dockerfile
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/subvenciones
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
